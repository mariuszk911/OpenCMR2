name: build

# The AmigaOS/PiStorm fork: build the Amiga target, package the .lha and
# publish it on version tags. The upstream platform builds (Windows, macOS,
# Android, Linux packages) are left to upstream; the Linux host build stays
# here because it runs the portable tests the Amiga code relies on.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # game/ must stay close to upstream: every differing line is a future merge
  # conflict (AGENTS.md rules 1-2).
  game-divergence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/game_divergence.py --check

  # Host build and tests: game logic, file layouts and the portable Amiga
  # helpers (codecs, settings, notices) are tested here.
  linux:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          sudo apt-get update
          sudo apt-get install -y clang ninja-build glslang-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libegl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
      - uses: actions/checkout@v4
      # Ubuntu 24.04 has no SDL3 package: the build fetches it.
      - run: cmake --preset linux -DOPENCMR2_VENDORED_SDL=ON
      - run: cmake --build --preset linux
      - run: ctest --preset linux

  amiga:
    runs-on: ubuntu-24.04
    env:
      # Pinned SDK downloads. A changed archive fails the checksum: update the
      # URL and hash together, after checking the new SDK keeps the dispatch
      # ABI (sizeof(MGLDispatchTable) == 840, checked by the build).
      PISTORM3D_URL: https://aminet.net/util/libs/PiStorm3D.lha
      PISTORM3D_SHA256: 57f9e733eda999a7c5472f43249857e18bf1009caa228559c79c603a2fe5dc37
      OGLES2_URL: https://github.com/ladislawv/ogles2/releases/download/v1.3.3/ogles2-1.3.3-sdk.zip
      OGLES2_SHA256: 90d0469f95852c256cde159f432868b27225fd3c1d40ac00ccc8fe2824892858
      IMAGE: opencmr2/amiga-toolchain:latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain image
        run: docker build -t "$IMAGE" -f tools/amiga/Dockerfile tools/amiga
      - name: SDKs
        run: |
          mkdir -p SDKs "$RUNNER_TEMP/sdk"
          cd "$RUNNER_TEMP/sdk"
          curl --fail --location --retry 3 --retry-delay 5 -o PiStorm3D.lha "$PISTORM3D_URL"
          curl --fail --location --retry 3 --retry-delay 5 -o ogles2-sdk.zip "$OGLES2_URL"
          printf '%s  PiStorm3D.lha\n%s  ogles2-sdk.zip\n' "$PISTORM3D_SHA256" "$OGLES2_SHA256" | sha256sum -c -
          # PiStorm3D (minigl.library 30.0 with the 29.1 client SDK), unpacked
          # with the LHa in the toolchain image.
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/w -w /w "$IMAGE" lha xq PiStorm3D.lha
          mv PiStorm3D "$GITHUB_WORKSPACE/SDKs/PiStorm3D"
          python3 -I -m zipfile -e ogles2-sdk.zip .
          mv ogles2-sdk-1.3.3 "$GITHUB_WORKSPACE/SDKs/ogles2-sdk-1.3.3"
          # The AHI developer files ship inside the toolchain image.
          cid=$(docker create "$IMAGE")
          docker cp "$cid:/root/build/ahi/m68k-amigaos-ahi" "$GITHUB_WORKSPACE/SDKs/m68k-amigaos-ahi"
          docker rm "$cid"
      - name: Build
        run: tools/amiga/build.sh --clean
      - name: Package
        run: tools/amiga/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-amiga
          path: dist/OpenCMR2-amiga-*.lha
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenCMR2-amiga-tests
          path: dist/amiga-tests/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [game-divergence, linux, amiga]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenCMR2-amiga
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.lha --verify-tag --generate-notes
